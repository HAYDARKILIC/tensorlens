[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorlens"
version = "0.1.0"
description = "First-principles diagnostic toolkit for modern LLM mechanics, high-dimensional geometry, and mechanistic interpretability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TensorLens Contributors" }]
keywords = [
    "llm",
    "interpretability",
    "mechanistic-interpretability",
    "loss-landscape",
    "hpc",
    "roofline",
    "sparse-autoencoder",
    "anisotropy",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "pyzmq>=25.1",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "nbqa>=1.8",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP", "S", "ANN", "C4", "SIM", "RET"]
ignore = ["ANN101", "ANN102", "S101", "S301"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]
"notebooks/*" = ["ANN", "S", "E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["plotly.*", "networkx.*", "msgpack.*", "zmq.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 85
